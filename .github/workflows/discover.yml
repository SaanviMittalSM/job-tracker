name: Job posting discovery (Greenhouse/Lever/Amazon) + snapshot export

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node scripts/discover.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Exports the live company list to companies_snapshot.json and commits it.
      # WebSearch-based discovery routines can't reach Supabase directly (network
      # policy), but they DO clone this repo — reading this file is how they get
      # the current dynamic company list instead of a hardcoded one in their prompt.
      - run: node scripts/export_snapshot.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add companies_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to companies_snapshot.json"
          else
            git commit -m "Update companies snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
