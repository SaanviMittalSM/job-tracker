name: Job posting discovery (Greenhouse/Lever)

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node scripts/discover.js

      - run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add postings.json
          if git diff --cached --quiet; then
            echo "No changes to postings.json"
          else
            git commit -m "Auto-discover: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
